name: Build RustAdmin ESP v0.2.0

on:
  push:
    branches:
      - build/rust-admin-esp-v0.2.0
    paths:
      - rust_admin_esp_src/**
      - .github/workflows/build-rust-admin-esp-v020.yml
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  build-linuxsteamrt64:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash -el {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates git build-essential pkg-config cmake ninja-build clang libssl-dev file binutils

      - name: Install Rust
        shell: bash -el {0}
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build release
        shell: bash -el {0}
        run: |
          cd rust_admin_esp_src
          cargo build --release

      - name: Validate binary
        shell: bash -el {0}
        run: |
          cd rust_admin_esp_src
          SO="target/release/librust_admin_esp.so"
          test -f "$SO"
          file "$SO"
          readelf -h "$SO"
          ldd "$SO" || true
          sha256sum "$SO" | tee rust_admin_esp.so.sha256

      - name: Prepare artifact
        shell: bash -el {0}
        run: |
          mkdir -p output/csgo/addons/plugify/envs/plugins/bin
          mkdir -p output/csgo/addons/plugify/envs/rust_admin_esp
          mkdir -p output/csgo/addons/plugify/configs
          cp rust_admin_esp_src/target/release/librust_admin_esp.so output/csgo/addons/plugify/envs/plugins/bin/rust_admin_esp.so
          cp rust_admin_esp_src/rust_admin_esp.pplugin output/csgo/addons/plugify/envs/rust_admin_esp/rust_admin_esp.pplugin
          cp rust_admin_esp_src/configs/rust_admin_esp.toml output/csgo/addons/plugify/configs/rust_admin_esp.toml
          cp rust_admin_esp_src/rust_admin_esp.so.sha256 output/
          find output -type f -print

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-admin-esp-v0.2.0-linuxsteamrt64
          path: output/
          retention-days: 7
